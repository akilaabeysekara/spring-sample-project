<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../assests/css/style.css">
</head>
<body>
<div id="navigation">
    <button onclick="window.location.href='Customer.html'">Customer</button>
    <button onclick="window.location.href='Item.html'">Item</button>
    <button onclick="window.location.href='Order.html'">Order</button>
    <button onclick="window.location.href='../index.html'">Home</button>
</div>
<h1>Order</h1>

<div id="order-data">
    <input type="text" id="order-id" placeholder="Order ID"><br>
    <select id="customer-select">
        <option value="">Select Customer</option>
    </select><br>
    <select id="item-select">
        <option value="">Select Item</option>
    </select><br>
    <input type="number" id="order-qty" placeholder="Quantity"><br>
    <input type="text" id="search-order" placeholder="Search Order"><br>
    <button onclick="saveOrder()">Save Order</button>
    <button onclick="updateOrder()">Update Order</button>
    <button onclick="deleteOrder()">Delete Order</button>
    <button onclick="searchOrder()">Search Order</button>
</div>

<div id="Orders">
    <table border="1" width="600" id="order-table">
        <thead>
        <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Item</th>
            <th>Quantity</th>
            <th>Price</th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>

<script src="../assests/js/jquery-3.7.1.min.js"></script>
<script src="../js/order.js"></script>


</body>
</html>
